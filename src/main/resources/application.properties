# ---------- Start Properties Core ----------
# spring.application.name=${APP_NAME}
# spring.profiles.active=${APP_ENV}
spring.profiles.default=${APP_ENV:dev}

spring.application.name=@project.artifactId@
# spring.profiles.default=dev
# spring.profiles.active=dev
# spring.profiles.active=stag
# spring.profiles.active=prod
spring.profiles.active=@profileActive@
# No usar en WAR: buscaría .env en el directorio compartido de WildFly.
# spring.config.import=optional:file:.env[.properties]
spring.h2.console.enabled=false
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# SonarQube is optional for application health monitoring.
app.sonarqube.url=${SONAR_HOST_URL:}
app.sonarqube.connect-timeout=${SONAR_CTO:1s}
app.sonarqube.read-timeout=${SONAR_RTO:2s}

# Server Properties
# server.port=8159
server.forward-headers-strategy=framework
# ---------- Final Properties Server ----------

# Orígenes autorizados para CORS. En producción puede sobrescribirse con
# CORS_ALLOWED_ORIGINS, separado por comas y sin barra final.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:4200,http://localhost:4200,https://wf40.datacompute.org}





# ---------- Start Properties Doc ----------
# Documentacion Spring
springdoc.api-docs.path=/api-docs
# springdoc.swagger-ui.supported-submit-methods=method
# Disponibilidad definida por ambiente mediante
# Deshabilitada por defecto cuando no se carga el perfil
springdoc.api-docs.enabled=false
# Swagger NO pasa por Spring Security
springdoc.enable-spring-security=false
springdoc.show-actuator=true
springdoc.swagger-ui.doc-expansion=none
# Documentar recursos con Swagger
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
# Documentar recursos con Scalar
scalar.enabled=false
scalar.path=/scalar
springdoc.writer-with-order-by-keys=true
# spring.mvc.pathmatch.matching-strategy=ant-path-matcher
# ---------- Final Properties Doc ----------





# ---------- Start Properties Docker ----------
# Docker Compose
spring.docker.compose.enabled=false
# ---------- Final Properties Docker ----------

# Evita los stack traces repetitivos del reportero cuando Zipkin no responde.
logging.level.zipkin2.reporter=ERROR





