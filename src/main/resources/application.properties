# Enable debug logs.
# spring.zipkin.base-url=http://127.0.0.1:9411
# spring.sleuth.sampler.probability=1.0





# ---------- Start Properties Logs ----------
# Enable debug logs.
# Habilita los logs de depuracion (debug).
# debug=false

# Arbitrary properties to add to the info endpoint.
# Propiedades arbitrarias que se añaden al endpoint de informacion.
#info*=

# Charset to use for console output.
# Charset para la salida en consola.
logging.charset.console=UTF-8

# Charset to use for file output.
# Charset para la salida en archivo.
# logging.charset.file=UTF-8

# Location of the logging configuration file. For instance, `classpath:logback.xml` for Logback.
# Ubicacion del archivo de configuracion de logging.
# logging.config=classpath:logback.xml

# Conversion word used when logging exceptions.
# Palabra de conversion utilizada al registrar excepciones.
logging.exception-conversion-word=%wEx

# Log file name (for instance, `tracing.log`)
# Nombre del archivo de log.
# logging.file.name=logs/tracing.log

# Location of the log file. For instance, `/var/log`.
# Ubicacion del archivo de log.
# logging.file.path=logs

# Log groups to quickly change multiple loggers at the same time. For instance, `logging.group.db=org.hibernate,org.springframework.jdbc`.
# Grupos de logs para cambiar multiples loggers a la vez.
logging.group.db=org.hibernate,org.springframework.jdbc

# Whether to include the application name in the logs.
# Incluye el nombre de la aplicacion en los logs.
logging.include-application-name=true

# Log levels severity mapping. For instance
# Mapeo de niveles de severidad de logs.
# logging.level.org.springframework=DEBUG

# Overriding configuration files used to create a composite configuration
# Archivos de configuracion de Log4j2 usados para crear una configuracion compuesta.
logging.log4j2.config.override=classpath:log4j2-override.xml

# Whether to clean the archive log files on startup
# Limpia los archivos de log archivados al iniciar.
# logging.logback.rollingpolicy.clean-history-on-start=true

# Pattern for rolled-over log file names
# Patron para los nombres de archivos de log archivados.
# logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
# logging.logback.rollingpolicy.file-name-pattern=logs/tracing.%d{yyyy-MM-dd}.%i.log.gz

# Maximum log file size
# Tamaño maximo del archivo de log.
# logging.logback.rollingpolicy.max-file-size=128MB

# Maximum number of archive log files to keep
# Numero maximo de archivos de log archivados a conservar.
# logging.logback.rollingpolicy.max-history=7

# Total size of log backups to be kept
# Tamaño total de los archivos de respaldo a conservar.
# logging.logback.rollingpolicy.total-size-cap=512MB

# Appender pattern for output to the console
# Patron del appender para la salida a la consola.
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{250} - %msg%n

# Appender pattern for log correlation
# Patron del appender para la correlacion de logs.
logging.pattern.correlation=%X{traceId}

# Appender pattern for log date format
# Patron para el formato de fecha en los logs.
logging.pattern.dateformat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX

# Appender pattern for output to a file
# Patron del appender para la salida a un archivo.
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Appender pattern for log level
# Patron del appender para el nivel de log.
logging.pattern.level=%5p

# Register a shutdown hook for the logging system when it is initialized. Disabled automatically when deployed as a war file
# Registra un hook de apagado para el sistema de logging.
logging.register-shutdown-hook=true

# Log level threshold for console output
# Umbral de nivel de log para la salida en consola.
# logging.threshold.console=TRACE

# Log level threshold for file output
# Umbral de nivel de log para la salida en archivo.
# logging.threshold.file=DEBUG

# Log level root
# logging.level.root=ALL
# logging.level.root=TRACE
# logging.level.root=DEBUG
# logging.level.root=INFO
# logging.level.root=WARN
# logging.level.root=ERROR
# logging.level.root=${LOG_ROOT:ERROR}

# Log level code
# logging.level.code=ALL
# logging.level.code=TRACE
# logging.level.code=DEBUG
# logging.level.code=INFO
# logging.level.code=WARN
# logging.level.code=ERROR
# logging.level.code=ERROR
# logging.level.code=${LOG_CODE:ERROR}
# ---------- Final Properties Logs ----------
