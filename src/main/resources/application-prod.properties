# ---------- Start Properties JPA ----------
# Crear tablas desde cero al arrancar
# spring.jpa.hibernate.ddl-auto=create
# Crear tablas al inicio y eliminarlas al cerrar
# spring.jpa.hibernate.ddl-auto=create-drop
# No modificar esquema de la base de datos
# spring.jpa.hibernate.ddl-auto=none
# Actualizar estructura sin eliminar datos
# spring.jpa.hibernate.ddl-auto=update
# Verificar el esquema sin modificar datos
# spring.jpa.hibernate.ddl-auto=validate
# Evitar el error 'LazyInitializationException'
spring.jpa.open-in-view=false
# Dialecto adaptando la generacion de las consultas SQL
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
# Formato des fecha en la aplicacion
spring.mvc.format.date=yyyy-MM-dd
# Ubicacion del archivo SQL de inicializacion con consultas
spring.sql.init.data-locations=classpath:database.prod.sql
# ---------- Final Properties JPA ----------





# ---------- Start Properties Server ----------
# Puerto del servidor
# server.port=8009
# app.openapi.server-url=http://127.0.0.1:8009
# app.openapi.server-description=Server Prod
# ---------- Final Properties Server ----------





# ---------- Start Properties Redis ----------
# Redis Enable Caching
spring.cache.type=redis
# Host del servidor
# spring.data.redis.host=127.0.0.1
# Puerto del servidor
# spring.data.redis.port=36379
# Redis database index
spring.data.redis.database=0
# Redis timeout in milliseconds
spring.data.redis.timeout=5s
# ---------- Final Properties Redis ----------





# ---------- Start Properties Jackson ----------
# Retornar JSON con sangria
app.jackson.indent-output=false
# ---------- Final Properties Jackson ----------





# ---------- Start Properties Logs ----------
# Charset to use for file output.
# Charset para la salida en archivo.
logging.charset.file=UTF-8

# Log file name (for instance, `tracing.log`)
# Nombre del archivo de log.
logging.file.name=logs/tracing.log

# Whether to clean the archive log files on startup
# Limpia los archivos de log archivados al iniciar.
logging.logback.rollingpolicy.clean-history-on-start=false

# Pattern for rolled-over log file names
# Patron para los nombres de archivos de log archivados.
logging.logback.rollingpolicy.file-name-pattern=logs/tracing.%d{yyyy-MM-dd}.%i.log.gz

# Maximum log file size
# Tamaño maximo del archivo de log.
logging.logback.rollingpolicy.max-file-size=100MB

# Maximum number of archive log files to keep
# Numero maximo de archivos de log archivados a conservar.
logging.logback.rollingpolicy.max-history=30

# Total size of log backups to be kept
# Tamaño total de los archivos de respaldo a conservar.
logging.logback.rollingpolicy.total-size-cap=5GB

# Log level root
logging.level.root=${LOG_ROOT:ERROR}

# Log level code
logging.level.code=${LOG_CODE:WARN}
# ---------- Final Properties Logs ----------
