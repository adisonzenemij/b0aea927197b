# ---------- Start Properties Data ----------
# Propiedad del driver JDBC para base de datos
spring.datasource.driver-class-name=${PD_DB_DRIVER}
# Propiedad de la URL de conexion a la base de datos
spring.datasource.url=${PD_DB_URL}
# Nombre de usuario para la base de datos
spring.datasource.username=${PD_DB_USER}
# Contraseña para conectarse a la base de datos
spring.datasource.password=${PD_DB_PASS}
# ---------- Final Properties Data ---------



# ---------- Start Properties JPA ----------
# Establecer la forma de cargar datos en la base
spring.jpa.hibernate.ddl-auto=${PD_JPA_DDL}
# ---------- Final Properties JPA ----------



# ---------- Start Properties Server ----------
# Configurar Swagger y OpenAPI para el ambiente
springdoc.api-docs.enabled=${PD_DOC:false}
springdoc.swagger-ui.enabled=${PD_DOC:false}
scalar.enabled=${PD_DOC:false}

# Puerto del servidor
server.port=${PD_SRV_PORT}
# ---------- Final Properties Server ----------



# ---------- Start Properties JWT ----------
# Secreto utilizado para firmar los tokens JWT del ambiente productivo.
app.jwt.secret=${PD_JWT_SECRET}
# Emisor incluido en los tokens JWT del ambiente productivo.
app.jwt.issuer=${PD_JWT_ISSUER:b0aea927197b-prod}
# Tiempo de vigencia, en segundos, de los tokens JWT de producción.
app.jwt.expiration-seconds=${PD_JWT_EXPIRATION_SECONDS:3600}
# ---------- Final Properties JWT ----------





# ---------- Start Properties Redis ----------
# Formato de almacenamiento de valores en Redis
app.redis.value-format=${PD_REDIS_FORMAT:JSON}
# Prefijo de las claves Redis para producción.
app.redis.cache-key-prefix=${PD_REDIS_PREFIX:${spring.application.name}::prod::}
# Host del servidor
spring.data.redis.host=${PD_REDIS_HOST}
# Puerto del servidor
spring.data.redis.port=${PD_REDIS_PORT}
# ---------- Final Properties Redis ----------





# ---------- Start Properties Zipkin ----------
management.tracing.export.zipkin.endpoint=${PD_ZIPKIN_PTCL}://${PD_ZIPKIN_HOST}:${PD_ZIPKIN_PORT}/api/v2/spans
management.tracing.export.zipkin.connect-timeout=${PD_ZIPKIN_CTO}
management.tracing.export.zipkin.read-timeout=${PD_ZIPKIN_RTO}
management.tracing.sampling.probability=${PD_ZIPKIN_SAMPLE}
# ---------- Final Properties Zipkin ----------

























