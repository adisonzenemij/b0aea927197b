# ---------- Start Properties Data ----------
# Propiedad del driver JDBC para base de datos
spring.datasource.driver-class-name=${SG_DB_DRIVER}
# Propiedad de la URL de conexion a la base de datos
spring.datasource.url=${SG_DB_URL}
# Nombre de usuario para la base de datos
spring.datasource.username=${SG_DB_USER}
# Contraseña para conectarse a la base de datos
spring.datasource.password=${SG_DB_PASS}
# ---------- Final Properties Data ---------



# ---------- Start Properties JPA ----------
# Establecer la forma de cargar datos en la base
spring.jpa.hibernate.ddl-auto=${SG_JPA_DDL}
# ---------- Final Properties JPA ----------



# ---------- Start Properties Server ----------
# Configurar Swagger y OpenAPI para el ambiente
springdoc.api-docs.enabled=${SG_DOC:true}
springdoc.swagger-ui.enabled=${SG_DOC:true}
scalar.enabled=${SG_DOC:true}

# Puerto del servidor
server.port=${SG_SRV_PORT}
# ---------- Final Properties Server ----------





# ---------- Start Properties JWT ----------
# Secreto utilizado para firmar los tokens JWT del ambiente de pruebas.
app.jwt.secret=${SG_JWT_SECRET}
# Emisor incluido en los tokens JWT del ambiente de pruebas.
app.jwt.issuer=${SG_JWT_ISSUER:b0aea927197b-stag}
# Tiempo de vigencia, en segundos, de los tokens JWT de pruebas.
app.jwt.expiration-seconds=${SG_JWT_EXPIRATION_SECONDS:3600}
# ---------- Final Properties JWT ----------





# ---------- Start Properties Redis ----------
# Formato de almacenamiento de valores en Redis
app.redis.value-format=${SG_REDIS_FORMAT:JSON}
# Prefijo de las claves Redis para staging.
app.redis.cache-key-prefix=${SG_REDIS_PREFIX:${spring.application.name}::stag::}
# Host del servidor
spring.data.redis.host=${SG_REDIS_HOST}
# Puerto del servidor
spring.data.redis.port=${SG_REDIS_PORT}
# ---------- Final Properties Redis ----------





# ---------- Start Properties Zipkin ----------
management.tracing.export.zipkin.endpoint=${SG_ZIPKIN_PTCL}://${SG_ZIPKIN_HOST}:${SG_ZIPKIN_PORT}/api/v2/spans
management.tracing.export.zipkin.connect-timeout=${SG_ZIPKIN_CTO}
management.tracing.export.zipkin.read-timeout=${SG_ZIPKIN_RTO}
management.tracing.sampling.probability=${SG_ZIPKIN_SAMPLE}
# ---------- Final Properties Zipkin ----------

























