# ---------- Start Properties JPA ----------
# Crear tablas desde cero al arrancar
# spring.jpa.hibernate.ddl-auto=create
# Crear tablas al inicio y eliminarlas al cerrar
# spring.jpa.hibernate.ddl-auto=create-drop
# No modificar esquema de la base de datos
# spring.jpa.hibernate.ddl-auto=none
# Actualizar estructura sin eliminar datos
# spring.jpa.hibernate.ddl-auto=update
# Verificar el esquema sin modificar datos
# spring.jpa.hibernate.ddl-auto=validate
# Evitar el error 'LazyInitializationException'
spring.jpa.open-in-view=false
# Dialecto adaptando la generacion de las consultas SQL
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
# Formato des fecha en la aplicacion
spring.mvc.format.date=yyyy-MM-dd
# Ubicacion del archivo SQL de inicializacion con consultas
spring.sql.init.data-locations=classpath:database.dev.sql
# ---------- Final Properties JPA ----------





# ---------- Start Properties Server ----------
# Puerto del servidor
# server.port=8001
# app.openapi.server-url=http://127.0.0.1:8001
# app.openapi.server-description=Server Test
# ---------- Final Properties Server ----------





# ---------- Start Properties Redis ----------
# Redis Enable Caching
spring.cache.type=redis
# Host del servidor
# spring.data.redis.host=127.0.0.1
# Puerto del servidor
# spring.data.redis.port=36371
# Redis database index
spring.data.redis.database=0
# Redis timeout in milliseconds
spring.data.redis.timeout=5s
# ---------- Final Properties Redis ----------





# ---------- Start Properties Jackson ----------
# Retornar JSON con sangria
app.jackson.indent-output=true
# ---------- Final Properties Jackson ----------





# ---------- Start HikariCP ----------
# Nombre identificador del pool (aparece en logs/metrics)
spring.datasource.hikari.pool-name=appPool
# Maximo de conexiones simultaneas en el pool (sube/baja segun tu BD y carga)
spring.datasource.hikari.maximum-pool-size=200
# Conexiones minimas en reposo que Hikari mantiene listas (warm)
spring.datasource.hikari.minimum-idle=20
# Tiempo maximo (ms) que una solicitud esperara una conexion antes de fallar
spring.datasource.hikari.connection-timeout=2000
# Tiempo maximo (ms) para validar una conexion (health check) antes de fallar
spring.datasource.hikari.validation-timeout=2000
# Tiempo (ms) que una conexion puede estar ociosa antes de ser elegible para cierre
spring.datasource.hikari.idle-timeout=600000
# Vida util maxima (ms) de una conexion antes de reciclarla (previene cortes por la BD)
spring.datasource.hikari.max-lifetime=1800000
# Intervalo (ms) para enviar pings de keepalive y evitar cierres por inactividad agresiva
spring.datasource.hikari.keepalive-time=300000
# Si una conexion permanece prestada mas de este tiempo (ms), loguea posible fuga
spring.datasource.hikari.leak-detection-threshold=0
# ---------- Final HikariCP ----------





# ---------- Start Actuator / Metricas ----------
# Expone endpoints de Actuator (util para ver metricas y el pool)
management.endpoints.web.exposure.include=health,info,metrics,threaddump,prometheus
# Muestra detalles de health en prod suele restringirse
management.endpoint.health.show-details=always
# ---------- Final Actuator / Metricas ----------





# ---------- Start Tomcat Embebed ----------
# Hilos maximos de procesamiento de peticiones en el Tomcat embebido
server.tomcat.threads.max=500
# Cola de peticiones cuando todos los hilos estan ocupados (backlog/espera)
server.tomcat.accept-count=2000
# Conexiones concurrentes que el conector puede sostener (nivel socket)
server.tomcat.max-connections=10000
# Tiempo de espera para la 1ª linea de la peticion y actividad de I/O
server.tomcat.connection-timeout=20s
# Tiempo max. que una conexion keep-alive se mantiene abierta sin nuevas peticiones
server.tomcat.keep-alive-timeout=20s
# Max. peticiones permitidas por conexion keep-alive (−1 = ilimitado)
server.tomcat.max-keep-alive-requests=100
# ---------- Final Tomcat Embebed ----------





# ---------- Start Properties Logs ----------
# Enable debug logs.
# Habilita los logs de depuracion (debug).
debug=false

# Charset to use for file output.
# Charset para la salida en archivo.
logging.charset.file=UTF-8

# Log file name (for instance, `tracing.log`)
# Nombre del archivo de log.
logging.file.name=logs/tracing.log

# Whether to clean the archive log files on startup
# Limpia los archivos de log archivados al iniciar.
logging.logback.rollingpolicy.clean-history-on-start=true

# Pattern for rolled-over log file names
# Patron para los nombres de archivos de log archivados.
logging.logback.rollingpolicy.file-name-pattern=logs/tracing.%d{yyyy-MM-dd}.%i.log.gz

# Maximum log file size
# Tamaño maximo del archivo de log.
logging.logback.rollingpolicy.max-file-size=20MB

# Maximum number of archive log files to keep
# Numero maximo de archivos de log archivados a conservar.
logging.logback.rollingpolicy.max-history=7

# Total size of log backups to be kept
# Tamaño total de los archivos de respaldo a conservar.
logging.logback.rollingpolicy.total-size-cap=200MB

# Log level root
logging.level.root=${LOG_ROOT:INFO}

# Log level code
logging.level.code=${LOG_CODE:DEBUG}
# ---------- Final Properties Logs ----------
