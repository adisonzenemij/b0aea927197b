# ---------- Start Properties Data ----------
# DevTools: espera a que la compilación y MapStruct terminen antes de reiniciar.
# Con trigger-file, el reinicio ocurre solamente al actualizar .reloadtrigger.
spring.devtools.restart.poll-interval=10s
spring.devtools.restart.quiet-period=5s
# spring.devtools.restart.trigger-file=.reloadtrigger

# Propiedad del driver JDBC para base de datos
spring.datasource.driver-class-name=${DV_DB_DRIVER}
# Propiedad de la URL de conexion a la base de datos
spring.datasource.url=${DV_DB_URL}
# Nombre de usuario para la base de datos
spring.datasource.username=${DV_DB_USER}
# Contraseña para conectarse a la base de datos
spring.datasource.password=${DV_DB_PASS}
# ---------- Final Properties Data ---------



# ---------- Start Properties JPA ----------
# Establecer la forma de cargar datos en la base
spring.jpa.hibernate.ddl-auto=${DV_JPA_DDL}
# ---------- Final Properties JPA ----------



# ---------- Start Properties Server ----------
# Configurar Swagger y OpenAPI para el ambiente
springdoc.api-docs.enabled=${DV_DOC:true}
springdoc.swagger-ui.enabled=${DV_DOC:true}
scalar.enabled=${DV_DOC:true}

# Puerto del servidor
server.port=${DV_SRV_PORT}
# ---------- Final Properties Server ----------





# ---------- Start Properties JWT ----------
# Secreto utilizado para firmar los tokens JWT del ambiente de desarrollo.
app.jwt.secret=${DV_JWT_SECRET:development-only-jwt-secret-change-before-production-2026}
# Emisor incluido en los tokens JWT del ambiente de desarrollo.
app.jwt.issuer=${DV_JWT_ISSUER:b0aea927197b-dev}
# Tiempo de vigencia, en segundos, de los tokens JWT de desarrollo.
app.jwt.expiration-seconds=${DV_JWT_EXPIRATION_SECONDS:3600}
# ---------- Final Properties JWT ----------





# ---------- Start Properties Redis ----------
# Formato de almacenamiento de valores en Redis
app.redis.value-format=${DV_REDIS_FORMAT:JSON}
# Prefijo de las claves Redis para desarrollo.
app.redis.cache-key-prefix=${DV_REDIS_PREFIX:${spring.application.name}::dev::}
# Host del servidor
spring.data.redis.host=${DV_REDIS_HOST}
# Puerto del servidor
spring.data.redis.port=${DV_REDIS_PORT}
# ---------- Final Properties Redis ----------





# ---------- Start Properties Zipkin ----------
management.tracing.export.zipkin.endpoint=${DV_ZIPKIN_PTCL}://${DV_ZIPKIN_HOST}:${DV_ZIPKIN_PORT}/api/v2/spans
management.tracing.export.zipkin.connect-timeout=${DV_ZIPKIN_CTO}
management.tracing.export.zipkin.read-timeout=${DV_ZIPKIN_RTO}
management.tracing.sampling.probability=${DV_ZIPKIN_SAMPLE}
# ---------- Final Properties Zipkin ----------

























