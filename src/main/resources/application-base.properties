# ---------- Start Properties Redis ----------
# Redis Enable Caching
spring.cache.type=redis
# Host del servidor
spring.data.redis.host=127.0.0.1
# Puerto del servidor
spring.data.redis.port=0000
# Redis database index
spring.data.redis.database=0
# Redis timeout in milliseconds
spring.data.redis.timeout=5s
# ---------- Final Properties Redis ----------





# ---------- Start Properties Jackson ----------
# Retornar JSON con sangria
app.jackson.indent-output=true
# ---------- Final Properties Jackson ----------





# ---------- Start HikariCP ----------
# Nombre identificador del pool (aparece en logs/metrics)
spring.datasource.hikari.pool-name=appPool
# Maximo de conexiones simultaneas en el pool (sube/baja segun tu BD y carga)
spring.datasource.hikari.maximum-pool-size=200
# Conexiones minimas en reposo que Hikari mantiene listas (warm)
spring.datasource.hikari.minimum-idle=20
# Tiempo maximo (ms) que una solicitud esperara una conexion antes de fallar
spring.datasource.hikari.connection-timeout=2000
# Tiempo maximo (ms) para validar una conexion (health check) antes de fallar
spring.datasource.hikari.validation-timeout=2000
# Tiempo (ms) que una conexion puede estar ociosa antes de ser elegible para cierre
spring.datasource.hikari.idle-timeout=600000
# Vida util maxima (ms) de una conexion antes de reciclarla (previene cortes por la BD)
spring.datasource.hikari.max-lifetime=1800000
# Intervalo (ms) para enviar pings de keepalive y evitar cierres por inactividad agresiva
spring.datasource.hikari.keepalive-time=300000
# Si una conexion permanece prestada mas de este tiempo (ms), loguea posible fuga
spring.datasource.hikari.leak-detection-threshold=20000
# ---------- Final HikariCP ----------





# ---------- Start Actuator / Metricas ----------
# Expone endpoints de Actuator (util para ver metricas y el pool)
management.endpoints.web.exposure.include=health,info,metrics,threaddump,prometheus
# Muestra detalles de health en prod suele restringirse
management.endpoint.health.show-details=always
# ---------- Final Actuator / Metricas ----------





# ---------- Start Tomcat Embebido ----------
# Hilos maximos de procesamiento de peticiones en el Tomcat embebido
server.tomcat.threads.max=500
# Cola de peticiones cuando todos los hilos estan ocupados (backlog/espera)
server.tomcat.accept-count=2000
# Conexiones concurrentes que el conector puede sostener (nivel socket)
server.tomcat.max-connections=10000
# Tiempo de espera para la 1ª linea de la peticion y actividad de I/O
server.tomcat.connection-timeout=20s
# Tiempo max. que una conexion keep-alive se mantiene abierta sin nuevas peticiones
server.tomcat.keep-alive-timeout=20s
# Max. peticiones permitidas por conexion keep-alive (−1 = ilimitado)
server.tomcat.max-keep-alive-requests=100
# ---------- Final Tomcat Embebido ----------
