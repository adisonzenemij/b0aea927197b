# URL de la base H2 aislada para las pruebas automáticas.
spring.datasource.url=jdbc:h2:mem:devices-test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
# Secreto JWT exclusivo para ejecutar pruebas sin depender de variables externas.
app.jwt.secret=test-only-jwt-secret-change-before-production-2026
# Emisor que identifica los tokens generados durante las pruebas.
app.jwt.issuer=b0aea927197b-test
# Vigencia de los tokens emitidos durante las pruebas, en segundos.
app.jwt.expiration-seconds=3600
# Driver JDBC de H2 para las pruebas.
spring.datasource.driver-class-name=org.h2.Driver
# Usuario de la base H2 temporal.
spring.datasource.username=sa
# Contraseña de la base H2 temporal.
spring.datasource.password=
# Crea el esquema al iniciar la prueba y lo elimina al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
# Deshabilita Redis para que las pruebas no dependan de servicios externos.
spring.cache.type=none
# No exporta trazas durante las pruebas automáticas.
management.tracing.sampling.probability=0.0
# Deshabilita el documento OpenAPI durante pruebas.
springdoc.api-docs.enabled=false
# Deshabilita Swagger UI durante pruebas.
springdoc.swagger-ui.enabled=false
# Deshabilita Scalar durante pruebas.
scalar.enabled=false
